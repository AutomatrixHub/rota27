<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe2cf" />
  <meta name="rota27-version" content="0.15.1" />
  <title>Rota 27 Bodega • Comandas v0.15.1</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eee2cf;color:#1b1816}
    .loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:420px;background:#fbf6ee;border:1px solid #dccbb8;border-radius:20px;padding:24px;box-shadow:0 14px 34px rgba(45,29,16,.12)}
    .card strong{font-size:20px}.card p{color:#6f6257;line-height:1.45}.error{color:#b6453b}
  </style>
</head>
<body>
  <div class="loader"><div class="card"><strong>Rota 27 v0.15.1</strong><p id="status">Carregando comandas e sincronização…</p></div></div>
  <script>
    (async function(){
      const status=document.getElementById('status');
      try{
        const res=await fetch('./base-v013.html',{cache:'no-store'});
        if(!res.ok)throw new Error('Não foi possível carregar a base do aplicativo');
        let html=await res.text();
        html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>Rota 27 Bodega • Comandas v0.15.1</title>');
        html=html.replace('</head>',
          '<link rel="stylesheet" href="./assets/v014.css" />'+
          '<link rel="stylesheet" href="./assets/v014-dev3.css" />'+
          '<link rel="stylesheet" href="./assets/v015.css" />'+
          '<link rel="stylesheet" href="./assets/v015-dev2.css" />'+
          '<link rel="stylesheet" href="./assets/v015-dev3.css" />'+
          '<link rel="stylesheet" href="./assets/v015-dev4.css" />'+
          '<link rel="stylesheet" href="./assets/v015-rc2-ops.css" />'+
          '<link rel="stylesheet" href="./assets/v015-rc3-items.css" />'+
          '<link rel="stylesheet" href="./assets/v0151-hotfix.css?v=0151" />'+
          '<link rel="stylesheet" href="./assets/v0151-help.css?v=0151help" />'+
          '</head>');
        html=html.replace('</body>',
          '<script src="./assets/v014.js"><\/script>'+
          '<script src="./assets/v014-dev3.js"><\/script>'+
          '<script src="./assets/v014-rc2-category-fix.js"><\/script>'+
          '<script src="./assets/v014-final.js"><\/script>'+
          '<script src="./assets/v015-sync.js"><\/script>'+
          '<script src="./assets/v015-dev2.js"><\/script>'+
          '<script src="./assets/v015-dev3.js"><\/script>'+
          '<script src="./assets/v015-dev4.js"><\/script>'+
          '<script src="./assets/v015-rc2-ops.js"><\/script>'+
          '<script src="./assets/v015-rc3-items.js"><\/script>'+
          '<script src="./assets/v0151-hotfix.js?v=0151"><\/script>'+
          '<script src="./assets/v015-final.js?v=0151"><\/script>'+
          '<script src="./assets/v0151-help.js?v=0151help"><\/script>'+
          '</body>');
        document.open();document.write(html);document.close();
      }catch(err){
        status.className='error';
        status.textContent='Falha ao carregar o Rota 27 v0.15.1: '+(err&&err.message?err.message:'erro desconhecido')+'. Verifique a conexão e tente novamente.';
      }
    })();
  </script>
</body>
</html>
