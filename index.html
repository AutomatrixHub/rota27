<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Rota 27 Bodega • Comandas v0.20.0</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F5E9D5;color:#111111}
    .loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:420px;background:#FFF9F0;border:1px solid #D9C7A7;border-radius:20px;padding:24px;box-shadow:0 14px 34px rgba(17,17,17,.12)}

</head>
<body>

          '<link rel="stylesheet" href="./assets/v015-dev4.css" />'+

          '<link rel="stylesheet" href="./assets/v017.css?v=0200" />'+

          '<link rel="stylesheet" href="./assets/v0183-capixaba-help.css?v=0200" />'+

          '<link rel="stylesheet" href="./assets/v020-manager-dashboard.css?v=0200" />'+
          '</head>');
        html=html.replace('</body>',
          '<script src="./assets/v014.js"><\/script>'+
          '<script src="./assets/v014-dev3.js"><\/script>'+
          '<script src="./assets/v014-rc2-category-fix.js"><\/script>'+
          '<script src="./assets/v014-final.js"><\/script>'+
          '<script src="./assets/v015-sync.js"><\/script>'+

          '<script src="./assets/v020-preview-demo.js?v=0200"><\/script>'+
          '</body>');
        document.open();document.write(html);document.close();
      }catch(err){
        status.className='error';
        status.textContent='Falha ao carregar o Rota 27 v0.20.0: '+(err&&err.message?err.message:'erro desconhecido')+'. Verifique a conexão e tente novamente.';
      }
    })();

</body>
</html>
